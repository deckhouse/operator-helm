{{- $kubeVersion := .Values.global.discovery.kubernetesVersion }}
{{- $apiVersion := "" }}
{{- if semverCompare ">=1.30.0" $kubeVersion }}
{{- $apiVersion = "admissionregistration.k8s.io/v1" }}
{{- else if semverCompare ">=1.28.0" $kubeVersion }}
{{- $apiVersion = "admissionregistration.k8s.io/v1beta1" }}
{{- else if semverCompare ">=1.26.0" $kubeVersion }}
{{- $apiVersion = "admissionregistration.k8s.io/v1alpha1" }}
{{- end }}

{{- if $apiVersion }}
apiVersion: {{ $apiVersion }}
kind: ValidatingAdmissionPolicy
metadata:
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  name: operator-helm-restricted-access-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - "helm.internal.operator-helm.deckhouse.io"
          - "source.internal.operator-helm.deckhouse.io"
        apiVersions: ["*"]
        operations:
          - "CREATE"
          - "UPDATE"
          - "DELETE"
        resources: ["*"]
      - apiGroups:
          - "helm.deckhouse.io"
        apiVersions: ["*"]
        operations:
          - "CREATE"
          - "UPDATE"
          - "DELETE"
        resources:
          - "helmclusteraddoncharts"
          - "helmclusteraddoncharts/status"
          - "helmapplicationcharts"
          - "helmapplicationcharts/status"
          - "helmclusterapplicationcharts"
          - "helmclusterapplicationcharts/status"
          - "helmapplications/status"
          - "helmapplicationrepositories/status"
          - "helmclusterapplicationrepositories/status"
          - "helmclusteraddonrepositories/status"
          - "helmclusteraddons/status"
  validations:
    - expression: |
        request.userInfo.username.startsWith("system:serviceaccount:kube-system:") ||
        request.userInfo.username.startsWith("system:serviceaccount:d8-system:") ||
        request.userInfo.username in [
          "system:serviceaccount:d8-operator-helm:operator-helm-controller",
          "system:serviceaccount:d8-operator-helm:source-controller",
          "system:serviceaccount:d8-operator-helm:helm-controller",
          "system:serviceaccount:d8-operator-helm:chart-values-controller",
        ]
      message: "Operation forbidden for this user."
---
apiVersion: {{ $apiVersion }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  name: operator-helm-restricted-access-policy-binding
spec:
  policyName: operator-helm-restricted-access-policy
  validationActions:
    - "Deny"
  matchResources:
    namespaceSelector: {}
    objectSelector: {}
{{- if semverCompare ">=1.28.0" $kubeVersion }}
{{- $applicationSubject := printf "system:serviceaccount:d8-%s:hap-" .Chart.Name }}
{{- $protected := list "namespaces" "resourcequotas" "limitranges" }}
{{- $mutating := list "*" "create" "update" "patch" "delete" "deletecollection" }}
---
apiVersion: {{ $apiVersion }}
kind: ValidatingAdmissionPolicy
metadata:
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  name: operator-helm-application-protected-kinds-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          {{- range $protected }}
          - {{ . | quote }}
          {{- end }}
          - "namespaces/status"
          - "namespaces/finalize"
          - "resourcequotas/status"
      - apiGroups: ["deckhouse.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["projectnamespaces", "projectnamespaces/status"]
  matchConditions:
    - name: application-identity
      expression: 'request.userInfo.username.startsWith("{{ $applicationSubject }}")'
  validations:
    - expression: "false"
      message: "An application may not modify its namespace, resource quotas, limit ranges or project namespaces."
      reason: Forbidden
---
apiVersion: {{ $apiVersion }}
kind: ValidatingAdmissionPolicy
metadata:
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  name: operator-helm-application-role-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles"]
  matchConditions:
    - name: application-identity
      expression: 'request.userInfo.username.startsWith("{{ $applicationSubject }}")'
  validations:
    - expression: >-
        !has(object.rules) || !object.rules.exists(r,
          has(r.apiGroups) && has(r.resources) &&
          r.verbs.exists(v, v in {{ $mutating | toJson }}) &&
          ((r.apiGroups.exists(g, g == "*" || g == "") &&
            r.resources.exists(res, res == "*" || res.startsWith("*/") || res.split("/")[0] in {{ $protected | toJson }})) ||
           (r.apiGroups.exists(g, g == "*" || g == "deckhouse.io") &&
            r.resources.exists(res, res == "*" || res.startsWith("*/") || res.split("/")[0] == "projectnamespaces"))))
      message: "A Role written by an application may not grant write access to namespaces, resource quotas, limit ranges or project namespaces."
      reason: Forbidden
---
apiVersion: {{ $apiVersion }}
kind: ValidatingAdmissionPolicy
metadata:
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  name: operator-helm-application-rolebinding-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: application-identity
      expression: 'request.userInfo.username.startsWith("{{ $applicationSubject }}")'
  validations:
    - expression: 'object.roleRef.kind == "Role"'
      message: "A RoleBinding written by an application may reference only a Role of its namespace, not a ClusterRole."
      reason: Forbidden
{{- range list "protected-kinds" "role" "rolebinding" }}
---
apiVersion: {{ $apiVersion }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  {{- include "helm_lib_module_labels" (list $) | nindent 2 }}
  name: operator-helm-application-{{ . }}-policy-binding
spec:
  policyName: operator-helm-application-{{ . }}-policy
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector: {}
    objectSelector: {}
{{- end }}
{{- end }}
{{- end }}
