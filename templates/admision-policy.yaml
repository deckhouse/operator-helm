apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  name: operator-helm-restricted-access-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - "helm.internal.operator-helm.deckhouse.io"
          - "source.internal.operator-helm.deckhouse.io"
        apiVersions: ["*"]
        operations:
          - "CREATE"
          - "UPDATE"
          - "DELETE"
        resources: ["*"]
      - apiGroups:
          - "helm.deckhouse.io"
        apiVersions: ["*"]
        operations:
          - "CREATE"
          - "UPDATE"
          - "DELETE"
        resources:
          - "helmclusteraddoncharts"
          - "helmclusteraddoncharts/status"
          - "helmapplicationcharts"
          - "helmapplicationcharts/status"
          - "helmclusterapplicationcharts"
          - "helmclusterapplicationcharts/status"
          - "helmapplications/status"
          - "helmapplicationrepositories/status"
          - "helmclusterapplicationrepositories/status"
          - "helmclusteraddonrepositories/status"
          - "helmclusteraddons/status"
  validations:
    - expression: |
        request.userInfo.username.startsWith("system:serviceaccount:kube-system:") ||
        request.userInfo.username.startsWith("system:serviceaccount:d8-system:") ||
        request.userInfo.username in [
          "system:serviceaccount:d8-operator-helm:operator-helm-controller",
          "system:serviceaccount:d8-operator-helm:source-controller",
          "system:serviceaccount:d8-operator-helm:helm-controller",
          "system:serviceaccount:d8-operator-helm:chart-values-controller",
        ]
      message: "Operation forbidden for this user."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  name: operator-helm-restricted-access-policy-binding
spec:
  policyName: operator-helm-restricted-access-policy
  validationActions:
    - "Deny"
  matchResources:
    namespaceSelector: {}
    objectSelector: {}
