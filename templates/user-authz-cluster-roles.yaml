---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: Editor
  name: d8:user-authz:{{ .Chart.Name }}:editor
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplications
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationrepositories
  - helmapplicationcharts
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: Admin
  name: d8:user-authz:{{ .Chart.Name }}:admin
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
# Levels accumulate upwards, so Admin already carries everything the Editor role
# above grants. Only the difference belongs here.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationrepositories
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - patch
  - update
  - watch
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationcharts
  verbs:
  - get
