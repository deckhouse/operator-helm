---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: PrivilegedUser
  name: d8:user-authz:{{ .Chart.Name }}:privileged-user
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
# helmapplicationrepositories is deliberately absent: a repository keeps its registry
# credentials in the spec itself (spec.auth.password, there is no secretRef), so reading
# one is reading the password. Reading it therefore stays with Admin, which is the level
# that writes those credentials in the first place.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationcharts
  - helmapplications
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusterapplicationcharts
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: Admin
  name: d8:user-authz:{{ .Chart.Name }}:admin
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationrepositories
  - helmapplications
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
# Reading a repository is granted here rather than at PrivilegedUser: the registry
# password lives in the spec, so it must not reach a read-only level.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationrepositories
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: ClusterAdmin
  name: d8:user-authz:{{ .Chart.Name }}:cluster-admin
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusteraddons
  - helmclusteraddonrepositories
  - helmclusterapplicationrepositories
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusteraddoncharts
  verbs:
  - get
  - list
  - watch
