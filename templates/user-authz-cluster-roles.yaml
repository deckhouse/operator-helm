---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: Admin
  name: d8:user-authz:{{ .Chart.Name }}:admin
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplications
  - helmapplicationrepositories
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
# The chart catalog is written by the controller alone, so nobody gets more than a
# read of it. Repository credentials (spec.auth.username and spec.auth.password) live
# in the repository object itself, so the read granted above is also a read of every
# repository password in reach of this level.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationcharts
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: ClusterAdmin
  name: d8:user-authz:{{ .Chart.Name }}:cluster-admin
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
# The cluster-scoped kinds reach no level below this one, so these rules stand on
# their own rather than extending anything above.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusteraddons
  - helmclusteraddonrepositories
  - helmclusterapplicationrepositories
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
# Both chart catalogs are written by the controller alone, so nobody gets more
# than a read of them.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusteraddoncharts
  - helmclusterapplicationcharts
  verbs:
  - get
  - list
