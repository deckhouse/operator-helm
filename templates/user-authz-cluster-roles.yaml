---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: PrivilegedUser
  name: d8:user-authz:{{ .Chart.Name }}:privileged-user
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplications
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
# Repository credentials (spec.auth.username and spec.auth.password) live in the
# object itself, so reading a repository is reading its password. That is why this
# starts at PrivilegedUser, the level from which Deckhouse permits reading Secrets.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationrepositories
  - helmapplicationcharts
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: Admin
  name: d8:user-authz:{{ .Chart.Name }}:admin
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
# Levels accumulate upwards, so Admin already carries everything the role above
# grants, including reading both kinds. Only the difference belongs here.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationrepositories
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: ClusterAdmin
  name: d8:user-authz:{{ .Chart.Name }}:cluster-admin
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
# The cluster-scoped kinds reach no level below this one, so these rules stand on
# their own rather than extending anything above.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusteraddons
  - helmclusteraddonrepositories
  - helmclusterapplicationrepositories
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
# Both chart catalogs are written by the controller alone, so nobody gets more
# than a read of them.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusteraddoncharts
  - helmclusterapplicationcharts
  verbs:
  - get
  - list
