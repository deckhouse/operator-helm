---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: PrivilegedUser
  name: d8:user-authz:{{ .Chart.Name }}:privileged-user
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
# Grants no access to helmapplicationrepositories; reading one stays with Admin.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationcharts
  - helmapplications
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusterapplicationcharts
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: Admin
  name: d8:user-authz:{{ .Chart.Name }}:admin
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationrepositories
  - helmapplications
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
# Grants reading a repository here rather than at PrivilegedUser.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationrepositories
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: ClusterAdmin
  name: d8:user-authz:{{ .Chart.Name }}:cluster-admin
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusteraddons
  - helmclusteraddonrepositories
  - helmclusterapplicationrepositories
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusteraddoncharts
  verbs:
  - get
  - list
  - watch
