---
apiVersion: v1
kind: Service
metadata:
  name: chart-values-api
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "chart-values-controller")) | nindent 2 }}
spec:
  ports:
    - name: api
      port: 443
      targetPort: api
      protocol: TCP
  selector:
    app: chart-values-controller
