{{- if eq (include "operator-helm.enable_rbacv2" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:{{ .Chart.Name }}:view_resources
  annotations:
    en.meta.deckhouse.io/title: "Module {{ .Chart.Name }}: view cluster resources"
    ru.meta.deckhouse.io/title: "Модуль {{ .Chart.Name }}: просмотр кластерных ресурсов"
    en.meta.deckhouse.io/description: "Read-only access to the cluster-scoped addons and chart catalogs of the {{ .Chart.Name }} module, and to its configuration."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к кластерным аддонам, каталогам чартов и конфигурации модуля {{ .Chart.Name }}."
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/capability" (printf "system-capability.%s.view_resources" .Chart.Name) "rbac.deckhouse.io/scope" "system" "rbac.deckhouse.io/namespace" (printf "d8-%s" .Chart.Name) "rbac.deckhouse.io/aggregate-to-delivery-as" "viewer")) | nindent 2 }}
rules:
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusteraddoncharts
  - helmclusteraddons
  - helmclusterapplicationcharts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - deckhouse.io
  resourceNames:
  - {{ .Chart.Name }}
  resources:
  - moduleconfigs
  verbs:
  - get
  - list
  - watch
{{- end }}
