{{- if eq (include "operator-helm.enable_rbacv2" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:{{ .Chart.Name }}:manage_cluster_resources
  annotations:
    en.meta.deckhouse.io/title: "Module {{ .Chart.Name }}: manage cluster resources"
    ru.meta.deckhouse.io/title: "Модуль {{ .Chart.Name }}: управление кластерными ресурсами"
    en.meta.deckhouse.io/description: "Manage the cluster-scoped addons and repositories of the {{ .Chart.Name }} module."
    ru.meta.deckhouse.io/description: "Управление кластерными аддонами и репозиториями модуля {{ .Chart.Name }}."
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/capability" (printf "system-capability.%s.manage_cluster_resources" .Chart.Name) "rbac.deckhouse.io/scope" "system" "rbac.deckhouse.io/namespace" (printf "d8-%s" .Chart.Name) "rbac.deckhouse.io/aggregate-to-delivery-as" "superadmin")) | nindent 2 }}
rules:
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmclusteraddonrepositories
  - helmclusteraddons
  - helmclusterapplicationrepositories
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
{{- end }}
