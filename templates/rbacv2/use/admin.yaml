apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/kind" "use" "rbac.deckhouse.io/aggregate-to-kubernetes-as" "admin")) | nindent 2 }}
  name: d8:use:capability:module:{{ .Chart.Name }}:admin
rules:
# Creating a HelmApplication or HelmApplicationRepository is namespace-admin equivalent
# (see the controller's seeded Role), so write access aggregates only to admin, never
# to a namespace-scoped editor.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplications
  - helmapplicationrepositories
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
