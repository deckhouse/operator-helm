{{- if eq (include "operator-helm.enable_rbacv2" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:namespace-capability:{{ .Chart.Name }}:admin
  annotations:
    en.meta.deckhouse.io/title: "Module {{ .Chart.Name }}: admin"
    ru.meta.deckhouse.io/title: "Модуль {{ .Chart.Name }}: администрирование"
    en.meta.deckhouse.io/description: "Manage {{ .Chart.Name }} applications and repositories in a namespace."
    ru.meta.deckhouse.io/description: "Управление приложениями и репозиториями модуля {{ .Chart.Name }} в пространстве имён."
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/capability" (printf "namespace-capability.%s.admin" .Chart.Name) "rbac.deckhouse.io/scope" "namespace" "rbac.deckhouse.io/aggregate-to-namespace-as" "admin")) | nindent 2 }}
rules:
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationrepositories
  - helmapplications
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
# Reading a repository is granted here rather than in the user capability: the registry
# password lives in the spec, so it must not reach a read-only level.
#
# The cluster-scoped catalog an application may also pick a chart from,
# HelmClusterApplicationChart, is deliberately not listed: a namespace capability is
# only ever bound with a RoleBinding, so a rule on a cluster-scoped kind would never
# authorize anything and would only pretend to. That catalog is read through the
# system-scoped view capability of this module instead.
- apiGroups:
  - helm.deckhouse.io
  resources:
  - helmapplicationrepositories
  verbs:
  - get
  - list
  - watch
{{- end }}
