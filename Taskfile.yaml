version: "3"

silent: true

# Local e2e configuration written by dev:test:e2e:env; absent in CI, where the
# workflow environment takes precedence anyway.
dotenv: ["tests/e2e/.env"]

vars:
  deckhouse_lib_helm_ver: 1.71.2
  target: ""
  VALIDATION_FILES: "tools/validation/{main,messages,diff,doc_changes}.go"
  golangciLintVersion: "v2.13.2"

# Lists only the modules this repository authors, including tools/internalcrds. The
# rewriter's operatornelm package is covered by test:rewrite-rules below.
includes:
  api:
    taskfile: ./api/Taskfile.dist.yaml
    dir: ./api
  e2e:
    taskfile: ./tests/e2e/Taskfile.dist.yaml
    dir: ./tests/e2e
  hooks:
    taskfile: ./images/hooks/Taskfile.dist.yaml
    dir: ./images/hooks
  operator-helm-controller:
    taskfile: ./images/operator-helm-controller/Taskfile.dist.yaml
    dir: ./images/operator-helm-controller
  chart-values-controller:
    taskfile: ./images/chart-values-controller/Taskfile.dist.yaml
    dir: ./images/chart-values-controller
  internalcrds:
    taskfile: ./tools/internalcrds/Taskfile.dist.yaml
    dir: ./tools/internalcrds

  deps:
    taskfile: https://raw.githubusercontent.com/werf/common-ci/refs/heads/main/Taskfile.deps.yml
    flatten: true
    vars:
      golangciLintVersion: "{{.golangciLintVersion}}"

tasks:
  deps:install:all:
    desc: "Install development dependencies."
    deps:
      - deps:install:gci
      - deps:install:gofumpt
      - deps:install:golangci-lint
      - e2e:deps:install:ginkgo

  deps:install:e2e:
    desc: "Install e2e test dependencies."
    cmds:
      - task: e2e:deps:install:ginkgo

  generate:api:
    desc: "Regenerate API artifacts."
    cmds:
      - task: api:generate

  ci:generate:api:
    desc: "Run API generation and verify committed files."
    cmds:
      - task: api:ci:generate

  generate:internal-crds:
    desc: "Regenerate the internal CustomResourceDefinitions from upstream flux."
    cmds:
      - |
        set -eu
        helmControllerTag=$(sed -n 's/^ *helm-controller: *//p' build/components/versions.yml)
        sourceControllerTag=$(sed -n 's/^ *source-controller: *//p' build/components/versions.yml)
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        git clone --quiet --depth 1 --branch "$helmControllerTag" \
          https://github.com/fluxcd/helm-controller "$work/helm-controller"
        git clone --quiet --depth 1 --branch "$sourceControllerTag" \
          https://github.com/fluxcd/source-controller "$work/source-controller"
        cd tools/internalcrds
        go run . -out ../../crds/embedded/helm-controller.yaml \
          "$work/helm-controller/config/crd/bases"
        go run . -out ../../crds/embedded/source-controller.yaml \
          "$work/source-controller/config/crd/bases"

  check-flux-tags:
    desc: "Verify the upstream flux tags pinned in werf.inc.yaml match build/components/versions.yml."
    cmds:
      - |
        set -eu
        helmControllerTag=$(sed -n 's/^ *helm-controller: *//p' build/components/versions.yml)
        sourceControllerTag=$(sed -n 's/^ *source-controller: *//p' build/components/versions.yml)
        helmWerfTag=$(sed -n 's/.*\$helmControllerTag := "\(.*\)".*/\1/p' images/helm-controller/werf.inc.yaml)
        sourceWerfTag=$(sed -n 's/.*\$sourceControllerTag := "\(.*\)".*/\1/p' images/source-controller/werf.inc.yaml)
        for pin in "$helmControllerTag" "$sourceControllerTag" "$helmWerfTag" "$sourceWerfTag"; do
          if [ -z "$pin" ]; then
            echo "a version pin came out empty: build/components/versions.yml has '$helmControllerTag' and '$sourceControllerTag', the werf files have '$helmWerfTag' and '$sourceWerfTag'" >&2
            exit 1
          fi
        done
        if [ "$helmControllerTag" != "$helmWerfTag" ]; then
          echo "images/helm-controller/werf.inc.yaml pins helm-controller $helmWerfTag but build/components/versions.yml pins $helmControllerTag" >&2
          exit 1
        fi
        if [ "$sourceControllerTag" != "$sourceWerfTag" ]; then
          echo "images/source-controller/werf.inc.yaml pins source-controller $sourceWerfTag but build/components/versions.yml pins $sourceControllerTag" >&2
          exit 1
        fi
    silent: true

  ci:generate:internal-crds:
    desc: "Regenerate the internal CustomResourceDefinitions and verify they are committed."
    cmds:
      - task: check-flux-tags
      - task: generate:internal-crds
      - |
        git diff --exit-code crds/embedded || (echo "Please run task generate:internal-crds and commit changes" && exit 1)

  # Builds golangci-lint with the local toolchain instead of the upstream
  # install.sh used by the shared deps task.
  install:golangci-lint:
    desc: "Install golangci-lint binary to bin/golangci-lint-<version>."
    status:
      - test -x bin/golangci-lint-{{.golangciLintVersion}}
    cmds:
      - mkdir -p bin
      - GOBIN="$(pwd)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.golangciLintVersion}}
      - mv bin/golangci-lint bin/golangci-lint-{{.golangciLintVersion}}

  test:unit:
    desc: "Run the unit tests of every module."
    cmds:
      - task: api:test:unit
      - task: hooks:test:unit
      - task: operator-helm-controller:test:unit
      - task: chart-values-controller:test:unit
      - task: internalcrds:test:unit
      - task: test:rewrite-rules

  # Compares the proxy rule table against the generated definitions, uncached
  # because the definitions live outside the test's own module.
  test:rewrite-rules:
    desc: "Check the proxy rewrite rules against the generated definitions."
    cmds:
      - cd images/kube-api-rewriter && go test -count=1 ./pkg/operatornelm/...

  dev:build:
    desc: "Build the module from the working tree (werf --dev) and publish it to DEV_REGISTRY."
    preconditions:
      - sh: test -n "{{.DEV_REGISTRY | default .E2E_MODULE_SOURCE_REPO}}"
        msg: "Set DEV_REGISTRY=<registry>/<path>, or have E2E_MODULE_SOURCE_REPO in tests/e2e/.env."
    vars:
      # The registry, the tag, and the digest travel as one set: unless given
      # explicitly, the tag recorded in tests/e2e/.env wins over the branch name.
      DEV_TAG:
        sh: |
          if [ -n "${DEV_TAG:-}" ]; then printf '%s' "$DEV_TAG"
          elif [ -n "${E2E_MODULE_TAG_NAME:-}" ]; then printf '%s' "$E2E_MODULE_TAG_NAME"
          else
            pr=$(gh pr view --json number --jq .number 2>/dev/null || true)
            if [ -n "$pr" ]; then printf 'pr%s' "$pr"
            else git rev-parse --abbrev-ref HEAD | tr -c 'A-Za-z0-9_.\n-' '-' | sed 's/^[.-]*//; s/-*$//' | cut -c1-128; fi
          fi
    cmds:
      # systemd-run caps werf's own process tree; with the docker backend the
      # RUN stages live under dockerd and are not covered.
      - cmd: systemd-run --user --scope -p CPUQuota=400% -p MemoryMax=8G hack/dkp-build-module.sh --registry "{{.DEV_REGISTRY | default .E2E_MODULE_SOURCE_REPO}}" --tag "{{.DEV_TAG}}" --dev {{.CLI_ARGS}}
        platforms: [linux]
      - cmd: hack/dkp-build-module.sh --registry "{{.DEV_REGISTRY | default .E2E_MODULE_SOURCE_REPO}}" --tag "{{.DEV_TAG}}" --dev {{.CLI_ARGS}}
        platforms: [darwin]

  dev:test:e2e:env:
    desc: "Write tests/e2e/.env pointing the e2e suite at the published dev build."
    vars:
      # With nothing given and an empty .env this resolves the way CI does for a
      # pull request: the shared dev registry and the pr<N> tag of the current
      # branch's PR (the sanitized branch name when there is none).
      DEV_TAG:
        sh: |
          if [ -n "${DEV_TAG:-}" ]; then printf '%s' "$DEV_TAG"
          elif [ -n "${E2E_MODULE_TAG_NAME:-}" ]; then printf '%s' "$E2E_MODULE_TAG_NAME"
          else
            pr=$(gh pr view --json number --jq .number 2>/dev/null || true)
            if [ -n "$pr" ]; then printf 'pr%s' "$pr"
            else git rev-parse --abbrev-ref HEAD | tr -c 'A-Za-z0-9_.\n-' '-' | sed 's/^[.-]*//; s/-*$//' | cut -c1-128; fi
          fi
      MODULE_NAME:
        sh: "sed -n 's/^name: *//p' module.yaml"
    cmds:
      - |
        set -eu
        registry="{{.DEV_REGISTRY | default .E2E_MODULE_SOURCE_REPO | default "dev-registry.deckhouse.io/sys/deckhouse-oss/modules"}}"
        digest=$(crane digest "$registry/{{.MODULE_NAME}}:{{.DEV_TAG}}")
        f=tests/e2e/.env
        tmp=$(mktemp); trap 'rm -f "$tmp" "$tmp.n"' EXIT
        if [ -f "$f" ]; then cat "$f" > "$tmp"; else : > "$tmp"; fi
        # Replace one key, dropping its existing entry first; a quoted value may
        # span several lines (the CA certificate), so the removal is multiline-aware.
        put() {
          awk -v k="$1" '
            skip { if (/"[[:space:]]*$/) skip=0; next }
            $0 ~ "^(export )?"k"=" { if ($0 ~ /="/ && $0 !~ /"[[:space:]]*$/) skip=1; next }
            { print }
          ' "$tmp" > "$tmp.n" && mv "$tmp.n" "$tmp"
          printf 'export %s="%s"\n' "$1" "$2" >> "$tmp"
        }
        # The tag and the digest always have values (branch default / derived);
        # every other key is written only when this run was given one, otherwise
        # whatever the file already holds stays untouched.
        if [ -n "{{.DEV_REGISTRY}}" ]; then
          put DEV_REGISTRY "{{.DEV_REGISTRY}}"
          put E2E_MODULE_SOURCE_REPO "{{.DEV_REGISTRY}}"
        elif [ -z "{{.E2E_MODULE_SOURCE_REPO}}" ]; then
          put E2E_MODULE_SOURCE_REPO "$registry"
        fi
        if [ -n "{{.DEV_REGISTRY_DOCKER_CONFIG}}" ]; then put DEV_REGISTRY_DOCKER_CONFIG "{{.DEV_REGISTRY_DOCKER_CONFIG}}"; fi
        if [ -n "{{.E2E_MODULE_SOURCE_CA}}" ]; then put E2E_MODULE_SOURCE_CA "{{.E2E_MODULE_SOURCE_CA}}"; fi
        if [ -n "{{.KIND_REGISTRY_HOST}}" ]; then put KIND_REGISTRY_HOST "{{.KIND_REGISTRY_HOST}}"; fi
        if [ -n "{{.KIND_REGISTRY_CA_FILE}}" ]; then put KIND_REGISTRY_CA_FILE "{{.KIND_REGISTRY_CA_FILE}}"; fi
        if [ -n "{{.KIND_REGISTRY_AUTH}}" ]; then put KIND_REGISTRY_AUTH "{{.KIND_REGISTRY_AUTH}}"; fi
        put E2E_MODULE_TAG_NAME "{{.DEV_TAG}}"
        put E2E_MODULE_DIGEST "$digest"
        mv "$tmp" "$f"
        echo "tests/e2e/.env -> $registry/{{.MODULE_NAME}}:{{.DEV_TAG}} ($digest)"

  dev:test:e2e:
    desc: "dev:build, dev:test:e2e:env, then run the e2e tests against the dev build."
    cmds:
      - task: dev:build
      - task: dev:test:e2e:env
      # A fresh `task` process so the dotenv file written above is re-read.
      - task --yes e2e:tests

  test:e2e:setup:
    desc: "Setup environment for e2e tests."
    cmds:
      - task: e2e:kind:ci:setup

  test:e2e:
    desc: "Run e2e tests."
    cmds:
      - task: e2e:tests

  test:e2e:cleanup:
    desc: "Cleanup e2e environment."
    cmds:
      - task: e2e:kind:ci:cleanup

  check-werf:
    cmds:
      - which werf >/dev/null || (echo "werf not found."; exit 1)
    silent: true

  check-yq:
    cmds:
      - which yq >/dev/null || (echo "yq not found."; exit 1)
    silent: true

  check-jq:
    cmds:
      - which jq >/dev/null || (echo "jq not found."; exit 1)
    silent: true

  check-helm:
    cmds:
      - which helm >/dev/null || (echo "helm not found."; exit 1)
    silent: true

  helm-update-subcharts:
    deps:
      - check-helm
    cmds:
      - helm repo add deckhouse https://deckhouse.github.io/lib-helm
      - helm repo update deckhouse
      - helm dep update

  helm-bump-helm-lib:
    deps:
      - check-yq
    cmds:
      - yq -i '.dependencies[] |= select(.name == "deckhouse_lib_helm").version = "{{ .deckhouse_lib_helm_ver }}"' Chart.yaml
      - task: helm-update-subcharts

  build:
    deps:
      - check-werf
    cmds:
      - werf build {{ .target }}

  format:
    desc: "Run formatters for Go and YAML."
    cmds:
      - task: api:format
      - task: hooks:format
      - task: operator-helm-controller:format
      - task: chart-values-controller:format
      - task: e2e:format
      - task: internalcrds:format

  lint:
    deps:
      - install:golangci-lint
    cmds:
      - task: api:lint
      - task: hooks:lint
      - task: operator-helm-controller:lint
      - task: chart-values-controller:lint
      - task: e2e:lint
      - task: internalcrds:lint
      - task: lint:doc-ru

  lint:doc-ru:
    desc: "Check the correspondence between description fields in the original crd and the Russian language version"
    cmds:
      - |
        docker run \
          --rm -v "$PWD:/src" docker.io/fl64/d8-doc-ru-linter:v0.0.1-dev0 \
          sh -c \
            'for crd in /src/crds/*.yaml; do [[ "$(basename "$crd")" =~ ^doc-ru ]] || (echo ${crd}; /d8-doc-ru-linter -s "$crd" -d "/src/crds/doc-ru-$(basename "$crd")" -n /dev/null); done'

  validation:doc-changes:
    desc: "Doc-changes"
    cmds:
      - go run {{ .VALIDATION_FILES }} --type doc-changes
