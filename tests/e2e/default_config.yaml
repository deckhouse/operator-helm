clusterTransport:
  kubeConfig: ""

controllers:
  - name: "operator-helm-controller"
    namespace: "d8-operator-helm"
    labelSelector: "app=operator-helm-controller"
    containers:
      - "operator-helm-controller"
    logFilters:
      exclude:
        # On cascade deletion after tests, HelmClusterAddon reconcile can be triggered after repository removal.
        - "Failed to get internal repository"
        # Expected in the negative test that sets an invalid chart version; surfaced via status.
        - "failed to get desired chart version"
        # Transient controller-runtime cache reflector reconnects (watch/list drop,
        # unexpected EOF); self-recovering, not a real failure.
        - "Unexpected error when reading response body"
        - "Failed to watch"
        - "Failed to list"
      excludeRegexp: []
  - name: "chart-values-controller"
    namespace: "d8-operator-helm"
    labelSelector: "app=chart-values-controller"
    containers:
      - "chart-values-controller"
    logFilters:
      exclude: []
      excludeRegexp: []
  - name: "nelm-source-controller"
    namespace: "d8-operator-helm"
    labelSelector: "app=nelm-source-controller"
    containers:
      - "nelm-source-controller"
    logFilters:
      exclude: []
      excludeRegexp:
        - ".*"
  - name: "helm-controller"
    namespace: "d8-operator-helm"
    labelSelector: "app=helm-controller"
    containers:
      - "helm-controller"
    logFilters:
      exclude: []
      excludeRegexp:
        - ".*"
