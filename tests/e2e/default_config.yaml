clusterTransport:
  kubeConfig: ""

controllers:
  - name: "operator-helm-controller"
    namespace: "d8-operator-helm"
    labelSelector: "app=operator-helm-controller"
    containers:
      - "operator-helm-controller"
    logFilters:
      exclude:
        # Expected in the stall scenario that points a repository at a missing
        # source; the reconciler logs every failed read with the repository name.
        - "repo-source-not-found"
        # Expected in the stall scenario that puts a foreign Role under the name the
        # application identity needs; the reconciler logs the refusal to adopt it.
        - "is not managed by the operator"
        # Transient controller-runtime cache reflector reconnects (watch/list drop,
        # unexpected EOF); self-recovering, not a real failure.
        - "Unexpected error when reading response body"
        - "Failed to watch"
        - "Failed to list"
      excludeRegexp: []
  - name: "chart-values-controller"
    namespace: "d8-operator-helm"
    labelSelector: "app=chart-values-controller"
    containers:
      - "chart-values-controller"
    logFilters:
      exclude: []
      excludeRegexp: []
  - name: "source-controller"
    namespace: "d8-operator-helm"
    labelSelector: "app=source-controller"
    containers:
      - "source-controller"
    logFilters:
      exclude: []
      excludeRegexp:
        - ".*"
  - name: "helm-controller"
    namespace: "d8-operator-helm"
    labelSelector: "app=helm-controller"
    containers:
      - "helm-controller"
    logFilters:
      exclude: []
      excludeRegexp:
        - ".*"
