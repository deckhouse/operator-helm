---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmapplicationcharts.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: HelmApplicationChart представляет собой Helm-чарт, обнаруженный в HelmApplicationRepository. Эти ресурсы создаются автоматически во время синхронизации репозитория и защищены от изменений.
          properties:
            status:
              properties:
                iconURL:
                  description: URL-адрес иконки Helm-чарта. Применимо только для чартов из Helm-репозиториев.
                conditions:
                  description: Условия отражают последние наблюдения за состоянием чарта.
                observedGeneration:
                  description: Поколение ресурса, обработанное контроллером последним.
                versions:
                  description: Список всех версий Helm-чарта, изученных контроллером. Версия пригодна к использованию, если у неё нет unavailableReason.
                  items:
                    properties:
                      version:
                        description: Версия Helm-чарта.
                      ociRef:
                        description: OCI-ссылка, по которой опубликована эта версия, записанная из индекса репозитория. Заполняется только для версии helm-репозитория, чья запись в индексе указывает на реестр вместо архива чарта.
                      mediaType:
                        description: OCI media type слоя, содержащего эту версию чарта. Заполняется только для поддерживаемого слоя версии oci://-репозитория.
                      unavailableReason:
                        description: Причина, по которой версию нельзя задеплоить. Отсутствие поля означает, что версия пригодна.
                      unavailableMessage:
                        description: Человекочитаемые подробности к unavailableReason.
                      reexaminationRequired:
                        description: Признак того, что записанный вердикт для этой версии устарел и должен быть установлен заново по репозиторию.
