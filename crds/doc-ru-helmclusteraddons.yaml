---
# The twin carries the descriptions of the schema only, as every doc-ru- file in
# this directory does: the descriptions of the printer columns of
# helmclusteraddons.yaml have no counterpart here on purpose, so a column added or
# reworded there needs no edit on this side.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmclusteraddons.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: HelmClusterAddon представляет собой единичный экземпляр установки Helm-чарта в масштабе всего кластера, который может включать в себя определения пользовательских ресурсов (CRD) и требует прав cluster-admin для развертывания. В каждый момент времени может быть установлен только один экземпляр конкретного чарта.
          properties:
            spec:
              properties:
                chart:
                  properties:
                    helmClusterAddonChart:
                      description: |
                        Имя Helm-чарта для установки из указанного репозитория (например, «ingress-nginx» или «redis»).
                    helmClusterAddonRepository:
                      description: |
                        Имя ресурса HelmClusterAddonRepository, содержащего параметры подключения и учётные данные для доступа к репозиторию, в котором расположен чарт.
                    version:
                      description: Версия Helm-чарта для HelmClusterAddon.
                maintenance:
                  description: |
                    Стратегия согласования ресурса. При значении `NoResourceReconciliation` контроллер прекращает обновление управляемых ресурсов; при пустом значении (`""`) используется стандартное согласование.
                namespace:
                  description: Пространство имён для развёртывания релиза аддона.
                values:
                  description: Пользовательские значения для релиза HelmClusterAddon.
            status:
              properties:
                inventory:
                  description: Список объектов, развёрнутых чартом аддона.
                  items:
                    description: Запись описывает один объект, развёрнутый чартом релиза.
                    properties:
                      apiVersion:
                        description: Группа и версия API объекта; `v1` для объекта основной группы.
                      kind:
                        description: Вид объекта.
                      namespace:
                        description: Пространство имён объекта; пусто для объекта уровня кластера.
                      name:
                        description: Имя объекта.
                conditions:
                  description: Условия отражают последние наблюдения за состоянием ресурса.
                lastAppliedChart:
                  description: Последний применённый чарт, инициировавший установку или обновление аддона.
                  properties:
                    helmClusterAddonChart:
                      description: Имя Helm-чарта.
                    helmClusterAddonRepository:
                      description: Имя ресурса HelmClusterAddonRepository.
                    version:
                      description: Версия Helm-чарта.
                lastAppliedValues:
                  description: Последние применённые значения, инициировавшие установку или обновление аддона.
                observedGeneration:
                  description: Поколение ресурса, обработанное контроллером последним.
                lastForceReconcileTime:
                  description: |
                    Время обработки последнего запроса принудительной реконсиляции. Фиксирует, что запрос был обработан, а не что он завершился успешно.
