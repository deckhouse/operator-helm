---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmclusteraddons.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: HelmClusterAddon представляет собой единичный экземпляр установки Helm-чарта в масштабе всего кластера, который может включать в себя определения пользовательских ресурсов (CRD) и требует прав cluster-admin для развертывания. В каждый момент времени может быть установлен только один экземпляр конкретного чарта.
          properties:
            spec:
              properties:
                chart:
                  properties:
                    helmClusterAddonChart:
                      description: |
                        Имя Helm-чарта для установки из указанного репозитория (например, «ingress-nginx» или «redis»).
                    helmClusterAddonRepository:
                      description: |
                        Имя ресурса HelmClusterAddonRepository, содержащего параметры подключения и учётные данные для доступа к репозиторию, в котором расположен чарт.
                    version:
                      description: Версия Helm-чарта для HelmClusterAddon.
                maintenance:
                  description: |
                    Стратегия согласования ресурса.

                    При значении `NoResourceReconciliation` контроллер прекращает обновление управляемых ресурсов, что позволяет выполнять ручное вмешательство или обслуживание без перезаписи изменений оператором.
                    При пустом значении (`""`) используется стандартное согласование.
                namespace:
                  description: Пространство имён для развёртывания релиза аддона.
                values:
                  description: Пользовательские значения для релиза HelmClusterAddon.
            status:
              properties:
                conditions:
                  description: |
                    Условия отражают последние наблюдения за состоянием ресурса.

                    `Reconciling` и `Stalled` присутствуют, только когда применимо, следуя соглашению kstatus. `Reconciling` означает, что проход оставил после себя ожидание — внутренний объект ещё раскатывается либо произошёл сбой, у которого запланирован повтор, — и снимается тем проходом, которому больше нечего ждать. Пока идёт реконсиляция, запрошенная аннотацией принудительной реконсиляции, это условие имеет причину `ForceReconcile`, а по её завершении переходит к обычному вердикту. `Stalled` означает, что проход завершился ошибкой, которую не исправит повтор: дефектом в спецификации самого объекта, репозиторием с нечитаемым URL или реестром, отклонившим запрос. `Stalled` старше `Reconciling`: аддон, который не может продвинуться, не находится в процессе. Из такого состояния выходят, устранив причину и запросив реконсиляцию, а не ожиданием.
                lastAppliedChart:
                  description: Последний применённый чарт, инициировавший установку или обновление аддона.
                  properties:
                    helmClusterAddonChart:
                      description: Имя Helm-чарта.
                    helmClusterAddonRepository:
                      description: Имя ресурса HelmClusterAddonRepository.
                    version:
                      description: Версия Helm-чарта.
                lastAppliedValues:
                  description: Последние применённые значения, инициировавшие установку или обновление аддона.
                observedGeneration:
                  description: Поколение ресурса, обработанное контроллером последним.
                lastForceReconcileTime:
                  description: |
                    Время обработки последнего запроса принудительной реконсиляции. Фиксирует, что запрос был обработан, а не что он завершился успешно — результат отражает `Ready`.
