---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmclusterapplicationcharts.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: HelmClusterApplicationChart представляет собой Helm-чарт, обнаруженный в HelmClusterApplicationRepository. Эти ресурсы создаются автоматически во время синхронизации репозитория и защищены от изменений.
          properties:
            status:
              properties:
                iconURL:
                  description: URL-адрес иконки Helm-чарта. Применимо только для чартов из Helm-репозиториев.
                conditions:
                  description: Условия отражают последние наблюдения за состоянием чарта.
                observedGeneration:
                  description: Поколение ресурса, обработанное контроллером последним.
                versions:
                  description: Список всех версий Helm-чарта, изученных контроллером. Версия пригодна к использованию, если у неё нет unavailableReason; для OCI-репозитория у пригодной версии также заполнен media type слоя, который её содержит.
                  items:
                    properties:
                      version:
                        description: Версия Helm-чарта.
                      ociRef:
                        description: "OCI-ссылка, по которой опубликована эта версия, записанная из индекса репозитория. Заполняется только для версии helm-репозитория, чья запись в индексе указывает на OCI-репозиторий вместо архива чарта: такая версия раскатывается через внутренний OCIRepository, хотя её репозиторий — helm."
                      mediaType:
                        description: "OCI media type слоя, содержащего эту версию чарта. Заполняется только для версии oci://-репозитория и только когда слой поддерживается: пустое значение там означает, что версию нельзя задеплоить."
                      unavailableReason:
                        description: Причина, по которой версию нельзя задеплоить. Отсутствие поля означает, что версия пригодна.
                      unavailableMessage:
                        description: Человекочитаемые подробности к unavailableReason.
                      reexaminationRequired:
                        description: "Признак того, что записанный вердикт для этой версии устарел и должен быть установлен заново по репозиторию. Принудительное обновление oci://-репозитория ставит его ещё до обращения к реестру каждой версии, записанной в каталоге этого репозитория, кроме той, что уже ожидает вердикта: её и так перепроверяет каждый проход. Helm-репозиторий не помечается никогда: его индекс — это один документ, читаемый целиком на каждом проходе, поэтому ни один вердикт там не пропускается. Принудительное обновление перепроверяет версию, которую репозиторий по-прежнему предлагает и media type которой уже записан (иначе тег, перезалитый с другим содержимым, обычному проходу не виден), поэтому запрос записывается здесь, чтобы пережить проход, которому он был адресован. Версии, записанной как удалённая из репозитория, принудительное обновление не нужно: листинг, снова предлагающий тег, сам по себе свидетельствует, что за вердиктом стоит новое содержимое, поэтому её изучает любой проход, который её перечислил. Признак снимается проходом, изучившим версию, а также проходом, который увидел репозиторий целиком и подтвердил, что версия больше не предлагается, поэтому обновление завершается за столько проходов, сколько потребуется, а сами записи остаются читаемыми и пригодными для развёртывания."
