---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmclusterapplicationcharts.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: HelmClusterApplicationChart представляет собой Helm-чарт, обнаруженный в HelmClusterApplicationRepository. Эти ресурсы создаются автоматически во время синхронизации репозитория и защищены от изменений.
          properties:
            status:
              properties:
                iconURL:
                  description: URL-адрес иконки Helm-чарта. Применимо только для чартов из Helm-репозиториев.
                conditions:
                  description: Условия отражают последние наблюдения за состоянием чарта.
                observedGeneration:
                  description: Поколение ресурса, обработанное контроллером последним.
                versions:
                  description: Список всех версий Helm-чарта, изученных контроллером. Версия пригодна к использованию, если у неё нет unavailableReason; для OCI-репозитория у пригодной версии также заполнен media type слоя, который её содержит.
                  items:
                    properties:
                      version:
                        description: Версия Helm-чарта.
                      ociRef:
                        description: "OCI-ссылка, по которой опубликована эта версия, записанная из индекса репозитория. Заполняется только для версии helm-репозитория, чья запись в индексе указывает на OCI-репозиторий вместо архива чарта: такая версия раскатывается через внутренний OCIRepository, хотя её репозиторий — helm. Хост и путь сохраняются в написании индекса, тег всегда указан явно."
                      mediaType:
                        description: "OCI media type слоя, содержащего эту версию чарта. Заполняется только для версии oci://-репозитория и только когда слой поддерживается: пустое значение там означает, что версию нельзя задеплоить. Для версии с ociRef остаётся пустым — слой такого артефакта проверяется в момент раскатки и здесь не записывается."
                      unavailableReason:
                        description: Причина, по которой версию нельзя задеплоить. Отсутствие поля означает, что версия пригодна.
                      unavailableMessage:
                        description: Человекочитаемые подробности к unavailableReason.
