---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    heritage: deckhouse
    module: operator-helm
  name: helmapplications.helm.deckhouse.io
spec:
  group: helm.deckhouse.io
  names:
    kind: HelmApplication
    listKind: HelmApplicationList
    plural: helmapplications
    singular: helmapplication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Helm release chart name.
      jsonPath: .spec.chart.name
      name: Chart
      type: string
    - description: Helm release chart version.
      jsonPath: .spec.chart.version
      name: Chart Version
      type: string
    - description: The readiness status of the application
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: The namespaced repository the chart is taken from
      jsonPath: .spec.chart.repository
      name: Repository
      priority: 1
      type: string
    - description: The cluster-wide repository the chart is taken from
      jsonPath: .spec.chart.clusterRepository
      name: Cluster Repository
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HelmApplication represents an installation of a Helm chart inside
          a single namespace. The release is deployed into the namespace of the resource
          itself. The chart is applied with a ServiceAccount bound to a Role that
          grants every permission inside that namespace, so the right to create a
          HelmApplication is equivalent to administrator rights in its namespace;
          the Role and the binding belong to the module and are reconciled, so an
          edit to either does not outlast the application that needs it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            properties:
              chart:
                properties:
                  clusterRepository:
                    description: |-
                      Specifies the name of the cluster-wide HelmClusterApplicationRepository custom
                      resource that contains the connection details and credentials for the
                      repository where the chart is located.
                    maxLength: 63
                    minLength: 3
                    type: string
                  name:
                    description: |-
                      Specifies the name of the Helm chart to be installed
                      from the referenced repository (e.g., "nginx" or "redis").
                    minLength: 1
                    type: string
                  repository:
                    description: |-
                      Specifies the name of the HelmApplicationRepository custom resource in the same
                      namespace that contains the connection details and credentials for the
                      repository where the chart is located.
                    maxLength: 63
                    minLength: 3
                    type: string
                  version:
                    description: Version holds the HelmApplication chart version.
                    minLength: 1
                    type: string
                required:
                - name
                - version
                type: object
                x-kubernetes-validations:
                - message: exactly one of spec.chart.repository or spec.chart.clusterRepository
                    must be set
                  rule: has(self.repository) != has(self.clusterRepository)
              maintenance:
                description: |-
                  Maintenance specifies the reconciliation strategy for the resource.
                  When set to "NoResourceReconciliation", the controller will stop updating the
                  underlying resources, allowing for manual intervention or maintenance
                  without the operator overwriting changes.
                  When empty (""), standard reconciliation is active.
                enum:
                - ""
                - NoResourceReconciliation
                type: string
              values:
                description: Values holds the values for this HelmApplication release.
                x-kubernetes-preserve-unknown-fields: true
            required:
            - chart
            type: object
          status:
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the application state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: Time when the condition status last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message with additional information about the condition
                        state.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: Resource generation on which the condition state
                        is based.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: Reason for the last change in the condition state.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Condition status.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastAppliedChart:
                description: LastAppliedChart represents the latest chart that triggered
                  application install or update.
                properties:
                  clusterRepository:
                    description: |-
                      Specifies the name of the HelmClusterApplicationRepository custom resource the
                      chart was last taken from.
                    type: string
                  name:
                    description: Specifies the name of the Helm chart the release
                      was last deployed from.
                    type: string
                  repository:
                    description: |-
                      Specifies the name of the HelmApplicationRepository custom resource the chart
                      was last taken from.
                    type: string
                  version:
                    description: Version holds the chart version the release was last
                      deployed from.
                    type: string
                type: object
              lastAppliedValues:
                description: LastAppliedValues represents the latest values that triggered
                  application install or update.
                x-kubernetes-preserve-unknown-fields: true
              lastForceReconcileTime:
                description: |-
                  LastForceReconcileTime is the time the most recent force reconcile request was
                  processed. It records that the request was acted on, not that it succeeded:
                  the outcome is reported by Ready.
                format: date-time
                type: string
              observedGeneration:
                description: Generation represents resource generation that was last
                  processed by the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: application name must be at most 63 characters long
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
