---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    heritage: deckhouse
    module: operator-helm
  name: helmapplications.helm.deckhouse.io
spec:
  group: helm.deckhouse.io
  names:
    kind: HelmApplication
    listKind: HelmApplicationList
    plural: helmapplications
    singular: helmapplication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Helm release chart name.
      jsonPath: .spec.chart.name
      name: Chart
      type: string
    - description: Helm release chart version.
      jsonPath: .spec.chart.version
      name: Chart Version
      type: string
    - description: The readiness status of the application
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: The namespaced repository the chart is taken from
      jsonPath: .spec.chart.repository
      name: Repository
      priority: 1
      type: string
    - description: The cluster-wide repository the chart is taken from
      jsonPath: .spec.chart.clusterRepository
      name: Cluster Repository
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HelmApplication describes a Helm release within a single namespace.

          The release is deployed in the same namespace as the HelmApplication resource.

          The chart is deployed using a ServiceAccount with permissions to perform any operation on all resources in the namespace. Therefore, namespace administrator permissions are required to create a HelmApplication.

          The Role and RoleBinding associated with the ServiceAccount are managed by the module and automatically reconciled to their desired state. Any manual changes to these resources are overwritten.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            properties:
              chart:
                properties:
                  clusterRepository:
                    description: |-
                      Name of the HelmClusterApplicationRepository resource.

                      The specified repository is used as the Helm chart source.
                    maxLength: 63
                    minLength: 3
                    type: string
                  name:
                    description: Name of the Helm chart in the specified repository
                      (for example, `nginx` or `redis`).
                    minLength: 1
                    type: string
                  repository:
                    description: |-
                      Name of the HelmApplicationRepository resource in the same namespace.

                      The specified repository is used as the Helm chart source.
                    maxLength: 63
                    minLength: 3
                    type: string
                  version:
                    description: Helm chart version to install.
                    minLength: 1
                    type: string
                required:
                - name
                - version
                type: object
                x-kubernetes-validations:
                - message: exactly one of spec.chart.repository or spec.chart.clusterRepository
                    must be set
                  rule: has(self.repository) != has(self.clusterRepository)
              maintenance:
                description: |-
                  Resource reconciliation mode.

                  When set to `NoResourceReconciliation`, the controller pauses reconciliation of managed resources, allowing them to be modified manually without the controller overwriting the changes.
                  When set to an empty value (`""`), the standard reconciliation mode is used.
                enum:
                - ""
                - NoResourceReconciliation
                type: string
              values:
                description: Custom Helm chart values.
                x-kubernetes-preserve-unknown-fields: true
            required:
            - chart
            type: object
          status:
            properties:
              conditions:
                description: Conditions reflecting the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: Time when the condition status last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message with additional information about the condition
                        state.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: Resource generation on which the condition state
                        is based.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: Reason for the last change in the condition state.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Condition status.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastAppliedChart:
                description: Helm chart used during the last application installation
                  or upgrade.
                properties:
                  clusterRepository:
                    description: Name of the HelmClusterApplicationRepository resource
                      used during the last application installation or upgrade.
                    type: string
                  name:
                    description: Name of the Helm chart used during the last application
                      installation or upgrade.
                    type: string
                  repository:
                    description: Name of the HelmApplicationRepository resource used
                      during the last application installation or upgrade.
                    type: string
                  version:
                    description: Helm chart version used during the last application
                      installation or upgrade.
                    type: string
                type: object
              lastAppliedValues:
                description: Custom Helm chart values used during the last application
                  installation or upgrade.
                x-kubernetes-preserve-unknown-fields: true
              lastForceReconcileTime:
                description: |-
                  Time when the last forced reconciliation request was processed.

                  This value indicates that the request was processed but does not indicate that reconciliation completed successfully.
                  Reconciliation results are reflected in the `Ready` condition.
                format: date-time
                type: string
              observedGeneration:
                description: Latest resource generation processed by the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: application name must be at most 63 characters long
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
