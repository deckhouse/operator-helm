---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    heritage: deckhouse
    module: operator-helm
  name: helmclusterapplicationrepositories.helm.deckhouse.io
spec:
  group: helm.deckhouse.io
  names:
    kind: HelmClusterApplicationRepository
    listKind: HelmClusterApplicationRepositoryList
    plural: helmclusterapplicationrepositories
    singular: helmclusterapplicationrepository
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: The readiness status of the repository
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Status
      type: string
    - description: Repository synchronization status
      jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: Synced
      type: string
    - description: Time of the last successful catalog synchronization
      jsonPath: .status.lastSuccessfulSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: Scheduled time of the next synchronization attempt
      jsonPath: .status.nextSyncTime
      name: Next Sync
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HelmClusterApplicationRepository represents a cluster-wide Helm
          or OCI-compliant repository containing Helm charts that can be referenced
          by HelmApplication resources from any namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            properties:
              auth:
                description: Auth contains authentication credentials for the repository.
                properties:
                  password:
                    description: Repository authentication password.
                    minLength: 1
                    type: string
                  username:
                    description: Repository authentication username.
                    minLength: 1
                    type: string
                required:
                - password
                - username
                type: object
              caCertificate:
                description: CACertificate is the PEM encoded CA certificate for TLS
                  verification.
                type: string
              insecureSkipVerify:
                description: InsecureSkipVerify disable TLS certificate verification.
                type: boolean
              url:
                description: URL of the Helm repository. Supports http(s):// and oci://
                  protocols.
                type: string
                x-kubernetes-validations:
                - message: URL must have a valid protocol (http, https, oci) and a
                    non-empty path
                  rule: self.matches('^(https?|oci)://.+$')
            required:
            - url
            type: object
          status:
            properties:
              chartCount:
                description: |-
                  ChartCount is the number of charts the repository offered when it was last read
                  successfully. It is absent until the first successful read, so a repository that
                  has never been read is distinguishable from one that offers no charts.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                  of the repository state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: Time when the condition status last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message with additional information about the condition
                        state.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: Resource generation on which the condition state
                        is based.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: Reason for the last change in the condition state.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Condition status.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveFetchFailures:
                description: |-
                  ConsecutiveFetchFailures counts consecutive failures to read from the repository.
                  It drives the retry backoff and resets on the first success.
                format: int32
                type: integer
              lastForceReconcileTime:
                description: |-
                  LastForceReconcileTime is the time the most recent force reconcile request was
                  processed. It records that the request was acted on, not that it succeeded:
                  the outcome is reported by Ready and Synced.
                format: date-time
                type: string
              lastSuccessfulSyncTime:
                description: |-
                  LastSuccessfulSyncTime is the last time the chart catalog was fully brought up to date,
                  including creating and pruning chart resources.
                format: date-time
                type: string
              nextSyncTime:
                description: NextSyncTime is the scheduled time of the next synchronization
                  attempt.
                format: date-time
                type: string
              observedGeneration:
                description: Generation represents resource generation that was last
                  processed by the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: repository name must be between 3 and 63 characters long
          rule: self.metadata.name.size() >= 3 && self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
