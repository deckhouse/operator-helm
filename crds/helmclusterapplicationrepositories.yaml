---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    heritage: deckhouse
    module: operator-helm
  name: helmclusterapplicationrepositories.helm.deckhouse.io
spec:
  group: helm.deckhouse.io
  names:
    kind: HelmClusterApplicationRepository
    listKind: HelmClusterApplicationRepositoryList
    plural: helmclusterapplicationrepositories
    singular: helmclusterapplicationrepository
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: The readiness status of the repository
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Status
      type: string
    - description: Repository synchronization status
      jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: Synced
      type: string
    - description: Time of the last successful catalog synchronization
      jsonPath: .status.lastSuccessfulSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: Scheduled time of the next synchronization attempt
      jsonPath: .status.nextSyncTime
      name: Next Sync
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HelmClusterApplicationRepository describes a Helm or OCI-compliant repository containing Helm charts that can be referenced by HelmApplication resources from any namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            properties:
              auth:
                description: Credentials for repository authentication.
                properties:
                  password:
                    description: Repository authentication password.
                    minLength: 1
                    type: string
                  username:
                    description: Repository authentication username.
                    minLength: 1
                    type: string
                required:
                - password
                - username
                type: object
              caCertificate:
                description: CA certificate in PEM format for verifying the repository TLS certificate.
                type: string
              insecureSkipVerify:
                description: Disables verification of the repository TLS certificate.
                type: boolean
              url:
                description: |-
                  URL of the Helm or OCI repository.

                  Supported schemes: `http(s)://` and `oci://`.
                type: string
                x-kubernetes-validations:
                - message: URL must have a valid protocol (http, https, oci) and a
                    non-empty path
                  rule: self.matches('^(https?|oci)://.+$')
            required:
            - url
            type: object
          status:
            properties:
              chartCount:
                description: |-
                  Number of charts discovered during the last successful repository synchronization.

                  The field is not populated until the first successful synchronization, which distinguishes a repository that has not yet been synchronized from a repository that contains no charts.
                format: int32
                type: integer
              conditions:
                description: Conditions reflecting the current state of the repository.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Time when the condition status last changed.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Message with additional information about the condition state.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        Resource generation on which the condition state is based.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        Reason for the last change in the condition state.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Condition status.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveFetchFailures:
                description: |-
                  Number of consecutive failed attempts to access the repository.

                  Used to determine the delay before the next attempt and reset after a successful attempt.
                format: int32
                type: integer
              lastForceReconcileTime:
                description: |-
                  Time when the last forced reconciliation request was processed.

                  This value indicates that the request was processed but does not indicate that reconciliation completed successfully.
                  Reconciliation results are reflected in the `Ready` and `Synced` conditions.
                format: date-time
                type: string
              lastSuccessfulSyncTime:
                description: |-
                  Time of the last successful repository synchronization.
                format: date-time
                type: string
              nextSyncTime:
                description: Scheduled time of the next repository synchronization attempt.
                  attempt.
                format: date-time
                type: string
              observedGeneration:
                description: Latest resource generation processed by the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: repository name must be between 3 and 63 characters long
          rule: self.metadata.name.size() >= 3 && self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
