---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmclusteraddonrepositories.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: HelmClusterAddonRepository представляет собой Helm- или OCI-совместимый репозиторий, содержащий Helm-чарты, на которые могут ссылаться ресурсы HelmClusterAddon.
          properties:
            spec:
              properties:
                auth:
                  description: Учётные данные для аутентификации в репозитории.
                  properties:
                    password:
                      description: Пароль для аутентификации в репозитории.
                    username:
                      description: Имя пользователя для аутентификации в репозитории.
                caCertificate:
                  description: CA-сертификат в формате PEM для проверки TLS.
                insecureSkipVerify:
                  description: |
                    Выключить проверку TLS-сертификата.

                    Действует на загрузку каталога, которую выполняет сам оператор, и, для
                    OCI-реестра, на скачивание чарта при установке. Чарты HTTPS-репозитория
                    Helm скачивает source-controller, а он учитывает этот флаг только для OCI,
                    поэтому у репозитория с самоподписанным сертификатом каталог появится, но
                    установка из него будет падать. Для такого репозитория используйте
                    `caCertificate`.
                url:
                  description: |
                    URL Helm-репозитория.

                    Поддерживаются протоколы `http(s)://` и `oci://`.
            status:
              properties:
                conditions:
                  description: Условия отражают последние наблюдения за состоянием репозитория.
                observedGeneration:
                  description: Поколение ресурса, обработанное контроллером последним.
                lastSuccessfulSyncTime:
                  description: Время последнего успешного приведения каталога чартов в актуальное состояние.
                lastSyncedGeneration:
                  description: |
                    Поколение спецификации, которой соответствует опубликованный сейчас каталог чартов. Записывается каждым проходом, опубликовавшим каталог, в том числе проходом, оставившим теги, про которые реестр не ответил: каталог всё равно перечисляет все существующие версии. Сохраняет значение при последующих сбоях — именно это отличает опубликованный каталог от того, который просто сейчас не обновляется. Релизы читают его, чтобы понять, ответил ли уже репозиторий про чарт, который они называют.
                unexaminedVersions:
                  description: |
                    Сколько версий чартов, предлагаемых репозиторием, отсутствуют в опубликованном сейчас каталоге: проход, записавший каталог, исчерпал свой бюджет и не успел их рассмотреть. Ноль означает, что каталог перечисляет все версии, которые предлагает репозиторий; положительное значение означает, что версия может отсутствовать в каталоге, хотя репозиторий ничего про неё не решил, — поэтому релиз, запросивший такую версию, ждёт прохода, который это выяснит, вместо сообщения о том, что репозиторий её не предлагает.

                    Это поле статуса, а не чтение условия `Synced`, по той же причине, что и `lastSyncedGeneration`: условие — вердикт последнего прохода, поэтому временная ошибка чтения поверх неполного каталога превратила бы его в вердикт о другом, тогда как это поле описывает каталог, который видит читатель, и переписывается только проходом, опубликовавшим каталог.
                nextSyncTime:
                  description: Запланированное время следующей попытки синхронизации.
                lastForceReconcileTime:
                  description: |
                    Время обработки последнего запроса принудительной реконсиляции. Фиксирует, что запрос был обработан, а не что он завершился успешно — результат отражают `Ready` и `Synced`.
                consecutiveFetchFailures:
                  description: Число подряд идущих неудачных обращений к репозиторию. Определяет задержку повтора и обнуляется при первом успехе.
                chartCount:
                  description: |
                    Число чартов, которые последнее успешное чтение нашло в репозитории, минус те, что остались за бортом, потому что их имя нельзя записать на объекте каталога (их перечисляет условие `Synced`). Описывает чтение, а не каталог: проход, у которого не удалось обновление каталога, тоже учитывается, а такое обновление может сорваться на самом первом чарте — поэтому, пока `Synced` сообщает об ошибке обновления каталога, число говорит о том, что предлагает репозиторий, а не о том, что лежит в каталоге. Это и не число объектов чартов в кластере — их может быть больше: чарт, который репозиторий больше не предлагает, сохраняется, пока на него кто-то ссылается. Отсутствует, пока успешного чтения не было, поэтому репозиторий, который ещё не читали, отличим от репозитория без чартов.
