---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmclusteraddonrepositories.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: HelmClusterAddonRepository описывает Helm- или OCI-совместимый репозиторий с Helm-чартами, на которые могут ссылаться ресурсы HelmClusterAddon.
          properties:
            spec:
              properties:
                auth:
                  description: Учётные данные для аутентификации в репозитории.
                  properties:
                    password:
                      description: Пароль для аутентификации в репозитории.
                    username:
                      description: Имя пользователя для аутентификации в репозитории.
                caCertificate:
                  description: CA-сертификат в формате PEM для проверки TLS-сертификата репозитория.
                insecureSkipVerify:
                  description: Отключает проверку TLS-сертификата репозитория.
                url:
                  description: |
                    URL-адрес Helm- или OCI-совместимого репозитория.

                    Поддерживаются схемы `http(s)://` и `oci://`.
            status:
              properties:
                conditions:
                  description: Условия, отражающие текущее состояние репозитория.
                  items:
                    properties:
                      lastTransitionTime:
                        description: |-
                          Время последнего изменения состояния условия.
                      message:
                        description: |-
                          Сообщение с дополнительной информацией о состоянии условия.
                      observedGeneration:
                        description: |-
                          Поколение ресурса, на основе которого сформировано состояние условия.
                      reason:
                        description: |-
                          Причина последнего изменения состояния условия.
                      status:
                        description: Состояние условия.
                      type:
                        description: Тип условия.
                observedGeneration:
                  description: Последнее поколение ресурса, обработанное контроллером.
                lastSuccessfulSyncTime:
                  description: Время последней успешной синхронизации репозитория.
                nextSyncTime:
                  description: Запланированное время следующей попытки синхронизации репозитория.
                lastForceReconcileTime:
                  description: |
                    Время обработки последнего запроса на принудительную реконсиляцию.

                    Значение поля указывает на то, что запрос был обработан, но не свидетельствует об успешном завершении реконсиляции.
                    Результат реконсиляции отображается в условиях `Ready` и `Synced`.
                consecutiveFetchFailures:
                  description: |-
                    Количество последовательных неудачных обращений к репозиторию.

                    Используется для определения задержки перед следующей попыткой и сбрасывается после успешного обращения.
                chartCount:
                  description: |
                    Количество чартов, обнаруженных при последней успешной синхронизации репозитория.

                    Поле не заполняется до первой успешной синхронизации, что позволяет отличить ещё не синхронизированный репозиторий от репозитория, в котором нет чартов.
