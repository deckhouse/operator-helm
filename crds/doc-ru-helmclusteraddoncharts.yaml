---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmclusteraddoncharts.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-          
            HelmClusterAddonChart описывает Helm-чарт, обнаруженный в HelmClusterAddonRepository.

            Ресурсы HelmClusterAddonChart создаются и обновляются контроллером автоматически во время синхронизации репозитория и не предназначены для изменения вручную.
          properties:
            status:
              properties:
                iconURL:
                  description: |-
                    URL-адрес иконки Helm-чарта.

                    Применимо только для чартов из Helm-репозиториев.
                conditions:
                  description: Условия, отражающие текущее состояние Helm-чарта.
                  items:
                    properties:
                      lastTransitionTime:
                        description: |-
                          Время последнего изменения состояния условия.
                      message:
                        description: |-
                          Сообщение с дополнительной информацией о состоянии условия.
                      observedGeneration:
                        description: |-
                          Поколение ресурса, на основе которого сформировано состояние условия.
                      reason:
                        description: |-
                          Причина последнего изменения состояния условия.
                      status:
                        description: Состояние условия.
                      type:
                        description: Тип условия.
                observedGeneration:
                  description: Последнее поколение ресурса, обработанное контроллером.
                versions:
                  description: |-
                    Список обнаруженных версий Helm-чарта.

                    Версия доступна для установки, если поле `unavailableReason` не заполнено.
                  items:
                    properties:
                      version:
                        description: Версия Helm-чарта.
                      ociRef:
                        description: |-
                          OCI-ссылка на опубликованную версию Helm-чарта.

                          Заполняется только для версии из Helm-репозитория, если соответствующая запись в индексе репозитория ссылается на OCI-репозиторий вместо архива чарта.
                      mediaType:
                        description: |-
                          OCI media type слоя, содержащего версию Helm-чарта.

                          Заполняется только для версий из OCI-репозитория (`oci://`) с поддерживаемым типом слоя.
                      unavailableReason:
                        description: |-
                          Причина, по которой версия Helm-чарта недоступна для установки.

                          Если поле не заполнено, версия доступна.
                      unavailableMessage:
                        description: Подробное описание причины, указанной в `unavailableReason`.
                      reexaminationRequired:
                        description: Признак того, что записанный вердикт для этой версии устарел и должен быть установлен заново по репозиторию.
