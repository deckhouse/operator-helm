---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmclusteraddoncharts.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: HelmClusterAddonChart представляет собой Helm-чарт, обнаруженный в HelmClusterAddonRepository. Эти ресурсы создаются автоматически во время синхронизации репозитория и защищены от изменений.
          properties:
            status:
              properties:
                conditions:
                  description: Условия отражают последние наблюдения за состоянием репозитория.
                observedGeneration:
                  description: Поколение ресурса, обработанное контроллером последним.
                versions:
                  description: Доступные версии Helm-чарта.
                  items:
                    properties:
                      version:
                        description: Версия Helm-чарта.
