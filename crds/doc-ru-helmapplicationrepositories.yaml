---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmapplicationrepositories.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            HelmApplicationRepository описывает Helm- или OCI-совместимый репозиторий с Helm-чартами, на которые могут ссылаться ресурсы HelmApplication из того же неймспейса.
          properties:
            spec:
              properties:
                auth:
                  description: Учётные данные для аутентификации в репозитории.
                  properties:
                    password:
                      description: Пароль для аутентификации в репозитории.
                    username:
                      description: Имя пользователя для аутентификации в репозитории.
                caCertificate:
                  description: CA-сертификат в формате PEM для проверки TLS-сертификата репозитория.
                insecureSkipVerify:
                  description: |-
                    Отключает проверку TLS-сертификата репозитория.

                    Действует только для OCI-реестра. Для HTTPS-репозитория Helm с самоподписанным сертификатом укажите `caCertificate`.
                url:
                  description: |
                    URL-адрес Helm- или OCI-совместимого репозитория.

                    Поддерживаются схемы `http(s)://` и `oci://`. URL-адрес `oci://` указывает на репозиторий одного Helm-чарта, например `oci://registry.example.com/charts/podinfo`.
            status:
              properties:
                conditions:
                  description: Условия, отражающие текущее состояние репозитория.
                  items:
                    properties:
                      lastTransitionTime:
                        description: |-
                          Время последнего изменения состояния условия.
                      message:
                        description: |-
                          Сообщение с дополнительной информацией о состоянии условия.
                      observedGeneration:
                        description: |-
                          Поколение ресурса, на основе которого сформировано состояние условия.
                      reason:
                        description: |-
                          Причина последнего изменения состояния условия.
                      status:
                        description: Состояние условия.
                      type:
                        description: Тип условия.
                observedGeneration:
                  description: Последнее поколение ресурса, обработанное контроллером.
                lastSuccessfulSyncTime:
                  description: Время последней успешной синхронизации репозитория.
                lastSyncedGeneration:
                  description: |-
                    Поколение ресурса, которому соответствует опубликованный каталог чартов.

                    Обновляется, когда синхронизация публикует каталог, не исчерпав отведённое ей время. Сохраняется, если последующие синхронизации завершились с ошибкой или исчерпали время.
                unexaminedVersions:
                  description: |-
                    Количество версий Helm-чартов в репозитории, которые последняя синхронизация, опубликовавшая каталог, не проверила, потому что исчерпала отведённое ей время. Сохраняется, если последующие синхронизации завершились с ошибкой.

                    Такие версии проверяются при следующих синхронизациях. Значение `0` означает, что проверены все версии, которые предлагает репозиторий.
                nextSyncTime:
                  description: Запланированное время следующей попытки синхронизации репозитория.
                lastForceReconcileTime:
                  description: |
                    Время обработки последнего запроса на принудительную реконсиляцию.

                    Значение поля указывает на то, что запрос был обработан, но не свидетельствует об успешном завершении реконсиляции.
                    Результат реконсиляции отображается в условиях `Ready` и `Synced`.
                consecutiveFetchFailures:
                  description: |-
                    Счётчик последовательных неудачных обращений к репозиторию, по которому определяется задержка перед следующей попыткой.

                    Не превышает `5`: ошибка, которую повторные попытки не исправят, сразу устанавливает значение `5`. Сбрасывается после успешного обращения и при изменении спецификации репозитория.
                chartCount:
                  description: |
                    Количество чартов, найденных при последнем успешном чтении репозитория, за вычетом чартов, имя которых нельзя записать в объект каталога.

                    Поле не заполняется до первого успешного чтения, что позволяет отличить ещё не прочитанный репозиторий от репозитория, в котором нет чартов.
