---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmapplicationrepositories.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: HelmApplicationRepository представляет собой Helm- или OCI-совместимый репозиторий, содержащий Helm-чарты, на которые могут ссылаться ресурсы HelmApplication из того же пространства имён.
          properties:
            spec:
              properties:
                auth:
                  description: Учётные данные для аутентификации в репозитории.
                  properties:
                    password:
                      description: Пароль для аутентификации в репозитории.
                    username:
                      description: Имя пользователя для аутентификации в репозитории.
                caCertificate:
                  description: CA-сертификат в формате PEM для проверки TLS.
                insecureSkipVerify:
                  description: |
                    Выключить проверку TLS-сертификата. Действует только на OCI-реестр; HTTPS-репозиторию Helm с самоподписанным сертификатом нужен `caCertificate`.
                url:
                  description: |
                    URL Helm-репозитория.

                    Поддерживаются протоколы `http(s)://` и `oci://`.
            status:
              properties:
                conditions:
                  description: Условия отражают последние наблюдения за состоянием репозитория.
                observedGeneration:
                  description: Поколение ресурса, обработанное контроллером последним.
                lastSuccessfulSyncTime:
                  description: Время последнего успешного приведения каталога чартов в актуальное состояние.
                lastSyncedGeneration:
                  description: |
                    Поколение спецификации, которой соответствует опубликованный сейчас каталог чартов. Записывается каждым проходом, опубликовавшим каталог, и сохраняет значение при последующих сбоях.
                unexaminedVersions:
                  description: |
                    Сколько версий чартов, предлагаемых репозиторием, отсутствуют в опубликованном сейчас каталоге. Ноль означает, что каталог перечисляет все версии, которые предлагает репозиторий.
                nextSyncTime:
                  description: Запланированное время следующей попытки синхронизации.
                lastForceReconcileTime:
                  description: |
                    Время обработки последнего запроса принудительной реконсиляции. Фиксирует, что запрос был обработан, а не что он завершился успешно.
                consecutiveFetchFailures:
                  description: Число подряд идущих неудачных обращений к репозиторию. Определяет задержку повтора и обнуляется при первом успехе.
                chartCount:
                  description: |
                    Число чартов, которые последнее успешное чтение нашло в репозитории, минус те, чьё имя нельзя записать на объекте каталога. Отсутствует, пока успешного чтения не было.
