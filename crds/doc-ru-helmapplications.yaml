---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmapplications.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            HelmApplication описывает Helm-релиз в пределах одного неймспейса.

            Релиз развёртывается в том же неймспейсе, в котором создан ресурс HelmApplication.

            Для развёртывания чарта используется ServiceAccount с правами роли администратора неймспейса. Поэтому для создания HelmApplication требуются права администратора неймспейса.

            Связанный с ServiceAccount ресурс RoleBinding управляется модулем и автоматически приводится к заданному состоянию при реконсиляции. Изменения, внесённые в этот ресурс вручную, будут перезаписаны.
          properties:
            spec:
              properties:
                chart:
                  properties:
                    name:
                      description: |
                        Имя Helm-чарта для установки из указанного репозитория (например, `nginx` или `redis`).
                    repository:
                      description: |
                        Имя ресурса HelmApplicationRepository в том же неймспейсе.

                        Указанный репозиторий используется как источник Helm-чарта.
                    clusterRepository:
                      description: |
                        Имя ресурса HelmClusterApplicationRepository.

                        Указанный репозиторий используется как источник Helm-чарта.
                    version:
                      description: Версия Helm-чарта для установки.
                maintenance:
                  description: |
                    Режим согласования ресурса.

                    При значении `NoResourceReconciliation` контроллер приостанавливает согласование управляемых ресурсов, что позволяет изменять их вручную без перезаписи изменений контроллером.
                    При пустом значении (`""`) используется стандартный режим согласования.
                timeout:
                  description: |-
                    Время ожидания завершения операции Helm.

                    Значение по умолчанию — `5m`. Значение должно быть больше нуля и не превышать `2h`.
                values:
                  description: Пользовательские значения Helm-чарта.
            status:
              properties:
                inventory:
                  description: Список объектов, развёрнутых Helm-чартом приложения.
                  items:
                    description: Объект, развёрнутый Helm-чартом релиза.
                    properties:
                      apiVersion:
                        description: Группа и версия API объекта (`v1` для объектов основной группы).
                      kind:
                        description: Тип объекта.
                      namespace:
                        description: |-
                          Неймспейс объекта.

                          Не заполняется для объектов уровня кластера.
                      name:
                        description: Имя объекта.
                conditions:
                  description: Условия, отражающие текущее состояние ресурса.
                  items:
                    properties:
                      lastTransitionTime:
                        description: |-
                          Время последнего изменения состояния условия.
                      message:
                        description: |-
                          Сообщение с дополнительной информацией о состоянии условия.
                      observedGeneration:
                        description: |-
                          Поколение ресурса, на основе которого сформировано состояние условия.
                      reason:
                        description: |-
                          Причина последнего изменения состояния условия.
                      status:
                        description: Состояние условия.
                      type:
                        description: Тип условия.
                lastAppliedChart:
                  description: Helm-чарт, использованный при последней установке или обновлении приложения.
                  properties:
                    name:
                      description: Имя Helm-чарта, использованного при последней установке или обновлении приложения.
                    repository:
                      description: Имя ресурса HelmApplicationRepository, использованного при последней установке или обновлении приложения.
                    clusterRepository:
                      description: Имя ресурса HelmClusterApplicationRepository, использованного при последней установке или обновлении приложения.
                    version:
                      description: Версия Helm-чарта, использованная при последней установке или обновлении приложения.
                lastAppliedValues:
                  description: Пользовательские значения Helm-чарта, использованные при последней установке или обновлении приложения.
                observedGeneration:
                  description: Последнее поколение ресурса, обработанное контроллером.
                lastForceReconcileTime:
                  description: |
                    Время обработки последнего запроса на принудительную реконсиляцию.

                    Значение поля указывает на то, что запрос был обработан, но не свидетельствует об успешном завершении реконсиляции.
                    Результат реконсиляции отображается в условии `Ready`.
