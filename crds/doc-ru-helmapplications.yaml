---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmapplications.helm.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: HelmApplication представляет собой установку Helm-чарта в пределах одного пространства имён. Релиз развёртывается в том же пространстве имён, где создан ресурс. Чарт применяется от имени ServiceAccount, связанного с Role, дающей все права внутри этого пространства имён, поэтому право создавать HelmApplication эквивалентно правам администратора пространства имён; Role и RoleBinding принадлежат модулю и реконсилируются, поэтому правка любого из них не переживает приложение, которому он нужен.
          properties:
            spec:
              properties:
                chart:
                  properties:
                    name:
                      description: |
                        Имя Helm-чарта для установки из указанного репозитория (например, «nginx» или «redis»).
                    repository:
                      description: |
                        Имя ресурса HelmApplicationRepository в том же пространстве имён, содержащего параметры подключения и учётные данные для доступа к репозиторию, в котором расположен чарт.
                    clusterRepository:
                      description: |
                        Имя кластерного ресурса HelmClusterApplicationRepository, содержащего параметры подключения и учётные данные для доступа к репозиторию, в котором расположен чарт.
                    version:
                      description: Версия Helm-чарта для HelmApplication.
                maintenance:
                  description: |
                    Стратегия согласования ресурса.

                    При значении `NoResourceReconciliation` контроллер прекращает обновление управляемых ресурсов, что позволяет выполнять ручное вмешательство или обслуживание без перезаписи изменений оператором.
                    При пустом значении (`""`) используется стандартное согласование.
                values:
                  description: Пользовательские значения для релиза HelmApplication.
            status:
              properties:
                conditions:
                  description: |
                    Условия отражают последние наблюдения за состоянием ресурса.

                    `Reconciling` и `Stalled` присутствуют, только когда применимо, следуя соглашению kstatus. `Reconciling` означает, что проход оставил после себя ожидание — внутренний объект ещё раскатывается либо произошёл сбой, у которого запланирован повтор, — и снимается тем проходом, которому больше нечего ждать. Пока идёт реконсиляция, запрошенная аннотацией принудительной реконсиляции, это условие имеет причину `ForceReconcile`, а по её завершении переходит к обычному вердикту. `Stalled` означает, что проход завершился ошибкой, которую не исправит повтор: дефектом в спецификации самого объекта, репозиторием с нечитаемым URL, реестром, отклонившим запрос, или объектом, уже занявшим нужное этому объекту имя. `Stalled` старше `Reconciling`: релиз, который не может продвинуться, не находится в процессе. Из такого состояния выходят, устранив причину и запросив реконсиляцию, а не ожиданием.
                lastAppliedChart:
                  description: Последний применённый чарт, инициировавший установку или обновление приложения.
                  properties:
                    name:
                      description: Имя Helm-чарта, из которого последний раз развёртывался релиз.
                    repository:
                      description: Имя ресурса HelmApplicationRepository, из которого последний раз был взят чарт.
                    clusterRepository:
                      description: Имя ресурса HelmClusterApplicationRepository, из которого последний раз был взят чарт.
                    version:
                      description: Версия Helm-чарта, из которой последний раз развёртывался релиз.
                lastAppliedValues:
                  description: Последние применённые значения, инициировавшие установку или обновление приложения.
                observedGeneration:
                  description: Поколение ресурса, обработанное контроллером последним.
                lastForceReconcileTime:
                  description: |
                    Время обработки последнего запроса принудительной реконсиляции. Фиксирует, что запрос был обработан, а не что он завершился успешно — результат отражает `Ready`.
