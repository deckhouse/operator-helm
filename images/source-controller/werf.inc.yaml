{{- $sourceControllerTag := "v1.9.5" }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
final: false
fromImage: builder/src
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
    - git clone --branch {{ $sourceControllerTag }} --single-branch $(cat /run/secrets/SOURCE_REPO)/fluxcd/source-controller.git /src/source-controller
    - rm -rf /src/source-controller/.git
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
final: false
fromImage: builder/golang
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
- id: GOPROXY
  value: {{ .GOPROXY }}
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  install:
    - cd /src/source-controller
    - |
      export GOOS=linux
      export GOARCH=amd64
      export CGO_ENABLED=0
      export GOPROXY=$(cat /run/secrets/GOPROXY)
      {{- include "image-build.build" (set $ "BuildCommand" `go build -trimpath -a -o source-controller main.go`) | indent 6 }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
fromImage: base/distroless
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
  add: /src/source-controller/source-controller
  to: /usr/bin/source-controller
  before: install
imageSpec:
  config:
    entrypoint: ["/usr/bin/source-controller"]
