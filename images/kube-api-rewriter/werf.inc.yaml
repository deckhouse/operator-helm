---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
final: false
fromImage: builder/distroless
git:
  - add: {{ .ModuleDir }}/images/{{ .ImageName }}
    to: /src/kube-api-rewriter
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-builder
final: false
fromImage: builder/golang
import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
mount:
  - fromPath: ~/go-pkg-cache
    to: /go/pkg
packages:
  - type: go-mod
    workdir: /src/kube-api-rewriter
    env:
      GOPROXY: "{{ .GOPROXY }}"
shell:
  install:
    - cd /src/kube-api-rewriter
    - export GOOS=linux
    - export CGO_ENABLED=0
    - export GOARCH=amd64
    - |
    {{- $_ := set $ "ProjectName" (list $.ImageName "kube-api-rewriter" | join "/") }}
    {{- include "image-build.build" (set $ "BuildCommand" `go build -mod=readonly -v -a -o kube-api-rewriter ./cmd/kube-api-rewriter`) | nindent 6 }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
fromImage: base/distroless
git:
  {{- include "image mount points" . }}
import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-builder
    add: /src/kube-api-rewriter/kube-api-rewriter
    to: /app/kube-api-rewriter
    after: install
  # Make containerd compatible directories structure.
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-builder
    add: /var
    to: /var
    includePaths:
      - run
    after: install
imageSpec:
  config:
    workingDir: "/app"
    entrypoint: ["/app/kube-api-rewriter"]
