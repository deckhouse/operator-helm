---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
final: false
fromImage: builder/src
git:
- add: {{ .ModuleDir }}/api
  to: /src/api
  stageDependencies:
    install:
      - go.mod
      - go.sum
    setup:
      - "**/*.go"
- add: {{ .ModuleDir }}/images/{{ .ImageName }}
  to: /src/images/operator-helm-artifact
  stageDependencies:
    install:
    - go.mod
    - go.sum
    setup:
    - "**/*.go"
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
final: false
fromImage: builder/golang
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  install:
  - cd /src/images/operator-helm-artifact
  - go mod download
  setup:
  - cd /src/images/operator-helm-artifact
  - mkdir /out
  - export GOOS=linux
  - export GOARCH=amd64
  - export CGO_ENABLED=0

  - |
    echo "Build operator-helm-controller binary"
    {{- $_ := set $ "ProjectName" (list $.ImageName "operator-helm-controller" | join "/") }}

    {{-   $buildCommand := printf "go build -ldflags=\"-s -w\" -tags %s -v -a -o /out/operator-helm-controller ./cmd/operator-helm-controller" .MODULE_EDITION -}}
    {{-   include "image-build.build" (set $ "BuildCommand" $buildCommand) | nindent 4 }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
fromImage: base/distroless
git:
  {{- include "image mount points" . }}
import:
- image:  {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
  add: /out/operator-helm-controller
  to: /app/operator-helm-controller
  after: install
imageSpec:
  config:
    workingDir: "/app"
    entrypoint: ["/app/operator-helm-controller"]