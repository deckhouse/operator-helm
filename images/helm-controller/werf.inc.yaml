{{- $helmControllerTag := "v0.1.5" }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
final: false
fromImage: builder/distroless
git:
  - url: {{ .SOURCE_REPO }}/werf/3p-helm-controller.git
    tag: {{ $helmControllerTag }}
    add: /
    to: /src/3p-helm-controller
---

image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
final: false
fromImage: builder/golang
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
packages:
  - type: go-mod
    workdir: /src/3p-helm-controller
    env:
      GOPROXY: "{{ .GOPROXY }}"
shell:
  install:
    - cd /src/3p-helm-controller
    - |
      export GOOS=linux
      export GOARCH=amd64
      export CGO_ENABLED=0
      {{- include "image-build.build" (set $ "BuildCommand" `go build -mod=readonly -trimpath -a -o helm-controller main.go`) | indent 6 }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
fromImage: base/distroless
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
  add: /src/3p-helm-controller/helm-controller
  to: /usr/bin/helm-controller
  before: install
imageSpec:
  config:
    entrypoint: ["/usr/bin/helm-controller"]
