{{- $helmControllerTag := "v1.6.4" }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
final: false
fromImage: builder/src
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
    - git clone --branch {{ $helmControllerTag }} --single-branch $(cat /run/secrets/SOURCE_REPO)/fluxcd/helm-controller.git /src/helm-controller
    - rm -rf /src/helm-controller/.git
---

image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
final: false
fromImage: builder/golang
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
- id: GOPROXY
  value: {{ .GOPROXY }}
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  install:
    - cd /src/helm-controller
    - |
      export GOOS=linux
      export GOARCH=amd64
      export CGO_ENABLED=0
      export GOPROXY=$(cat /run/secrets/GOPROXY)
      {{- include "image-build.build" (set $ "BuildCommand" `go build -trimpath -a -o helm-controller main.go`) | indent 6 }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
fromImage: base/distroless
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
  add: /src/helm-controller/helm-controller
  to: /usr/bin/helm-controller
  before: install
imageSpec:
  config:
    entrypoint: ["/usr/bin/helm-controller"]
