---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
final: false
fromImage: builder/src
git:
  - add: {{ .ModuleDir }}/images/{{ .ImageName }}
    to: /src/images/hooks
---
image: {{ .ModuleNamePrefix }}go-hooks-artifact
final: false
fromImage: builder/golang
import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
    add: /src
    to: /app
    before: install
mount:
  - fromPath: ~/go-pkg-cache
    to: /go/pkg
packages:
  - type: go-mod
    workdir: /app/images/hooks
    env:
      GOPROXY: "{{ .GOPROXY }}"
shell:
  install:
    - cd /app/images/hooks
    - |
      export GOOS=linux
      export GOARCH=amd64
      export CGO_ENABLED=0
      export TAGS="{{ printf "-tags %s" .MODULE_EDITION }}"
      {{- $_ := set $ "ProjectName" (list $.ImageName "hooks" | join "/") }}
      {{- include "image-build.build" (set $ "BuildCommand" `go build -mod=readonly -ldflags="-s -w" $TAGS -a -o /go-hooks/operator-helm-module-hooks ./cmd/operator-helm-module-hooks`) | nindent 6 }}
